<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nets">
<meta name="theme-color" content="#F7F4FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Nets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@500;600;700;800&family=Mulish:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app column, centered in a device frame on wide screens, full-bleed on phones. Single light lavender theme by choice. Bottom pill nav from the original Nets mockups. */
:root{
  color-scheme:light;
  --page:#E4DDF7;
  --bg1:#F7F4FF; --bg2:#ECE6FF; --bg3:#E2ECFF;
  --surface:#FFFFFF; --surface-2:#F5F2FE;
  --ink:#1F1838; --muted:#6B6590; --line:#E6E1F5;
  --accent:#6B58D3; --accent-ink:#FFFFFF; --accent-soft:#ECE7FD; --accent-text:#5745C4;
  --nav:#6A57CC; --nav-btn:#463596; --nav-active:#EEE9FF; --nav-ink:#FFFFFF; --nav-active-ink:#3B2B86;
  --ok:#1F7A5A; --ok-soft:#DDF3E9; --warn:#9C5814; --warn-soft:#FCEBD7; --gold:#9A6A0C; --gold-soft:#FBF0D3;
  --sky:#2F6FB8; --sky-soft:#E1EDFB;
  --shadow:0 12px 32px rgba(87,69,196,.09), 0 2px 6px rgba(87,69,196,.05);
  --display:"Encode Sans", "Segoe UI", system-ui, sans-serif;
  --body:"Mulish", "Segoe UI", system-ui, sans-serif;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;justify-content:center;align-items:center;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.18}
p{margin:0}

.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;
  background:radial-gradient(110% 55% at 100% 0%, var(--bg3) 0%, transparent 60%), radial-gradient(90% 50% at 0% 100%, #F1E9FF 0%, transparent 60%), linear-gradient(175deg,var(--bg1) 0%,var(--bg2) 100%);}
@media (min-width:600px) and (min-height:720px){
  .app{height:min(880px, calc(100% - 48px));border-radius:44px;box-shadow:0 0 0 10px #2A2150, 0 30px 80px rgba(42,33,80,.28)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 130px;-webkit-overflow-scrolling:touch}
.topbar{padding:26px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;color:var(--accent-text);font-size:19px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.eyebrow + h1{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, opacity .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--accent-soft);color:var(--accent-text)}
.btn-ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn-sm{padding:8px 14px;font-size:14px}
.btn-block{width:100%}
.row{display:flex;gap:8px}
.row > .btn{flex:1}
.link{background:none;border:0;color:var(--accent-text);font-weight:700;padding:4px 0;font-size:14px}
.namebtn{background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit}

.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:20px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.avatar{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--accent-soft);color:var(--accent-text)}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.lg{width:64px;height:64px;font-size:22px}

/* Onboarding */
.onboard{cursor:pointer;justify-content:center;padding:0 32px;user-select:none;-webkit-user-select:none;background:linear-gradient(170deg,#F8F5FF 0%,#EEE8FF 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none}
.blob.b1{width:260px;height:260px;background:#CFC2FF;top:-60px;right:-80px;animation:drift1 22s ease-in-out infinite alternate}
.blob.b2{width:220px;height:220px;background:#C9DEFF;bottom:-40px;left:-70px;animation:drift2 26s ease-in-out infinite alternate}
.blob.b3{width:160px;height:160px;background:#F3D6F4;top:45%;left:55%;animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(-50px,60px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-40px) scale(1.1)}}
.ob-content{position:relative}
.onboard .line{font-family:var(--display);font-weight:600;font-size:clamp(26px,7.4vw,31px);line-height:1.3;color:var(--ink)}
.onboard .line em{font-style:normal;color:var(--accent-text)}
.onboard .line strong{font-weight:800;color:var(--accent)}
.w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(12px);animation:wordIn 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wordIn{to{opacity:1;filter:blur(0);transform:none}}
.onboard .sub{margin-top:20px;color:var(--muted);font-size:16px;max-width:34ch;opacity:0;animation:softIn 1.4s ease forwards}
.onboard .cta{margin-top:34px;opacity:0;animation:softIn 1.2s ease forwards}
@keyframes softIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.onboard.instant .w,.onboard.instant .sub,.onboard.instant .cta{animation-duration:.25s!important;animation-delay:0s!important}
.ob-exit .ob-content{animation:obOut .6s ease forwards}
@keyframes obOut{to{opacity:0;transform:translateY(-14px);filter:blur(6px)}}
.onboard .progress{position:absolute;top:34px;left:32px;right:32px;display:flex;gap:6px}
.onboard .progress span{flex:1;height:3px;border-radius:3px;background:rgba(107,88,211,.15);overflow:hidden}
.onboard .progress span i{display:block;height:100%;width:0;background:var(--accent);transition:width .9s ease}
.onboard .progress span.on i{width:100%}
.onboard .hint{position:absolute;bottom:36px;left:32px;font-size:13px;color:var(--muted);font-weight:700;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.onboard .skip{position:absolute;top:48px;right:20px}
.hold{position:relative;overflow:hidden;width:100%;border:0;border-radius:999px;padding:18px 22px;background:var(--surface);color:var(--accent-text);font-family:var(--display);font-weight:800;font-size:17px;box-shadow:0 10px 30px rgba(107,88,211,.22);touch-action:none;-webkit-touch-callout:none}
.hold .fill{position:absolute;inset:0;background:linear-gradient(90deg,#8B79F0,var(--accent));transform:scaleX(0);transform-origin:left;border-radius:inherit}
.hold .lbl{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;transition:color .2s}
.hold.holding .lbl,.hold.done .lbl{color:#FFFFFF}
.hold.done .fill{transform:scaleX(1)}
.hold-help{margin-top:12px;font-size:13px;color:var(--muted);font-weight:600;text-align:center}
.promise{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent-text);text-align:center;margin-top:16px;animation:softIn .8s ease both}
@media (prefers-reduced-motion:reduce){.w,.onboard .sub,.onboard .cta{animation:none;opacity:1;filter:none;transform:none}.blob,.hint{animation:none}.ob-exit .ob-content{animation:none}}

/* Pace + permission */
.intro-h{font-size:27px;line-height:1.16}
.pace-opts{display:grid;gap:10px;margin-top:22px}
.pace-opt{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px 16px;text-align:left;box-shadow:var(--shadow)}
.pace-opt .num{font-family:var(--display);font-weight:700;font-size:26px;width:34px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.pace-opt b{display:block}
.pace-opt span{font-size:13px;color:var(--muted)}
.pace-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ios-alert{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-align:center;margin-top:28px}
.ios-alert .body{padding:22px 20px 18px}
.ios-alert h3{font-size:17px}
.ios-alert p{margin-top:8px;font-size:14px;color:var(--muted)}
.ios-alert .acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.ios-alert .acts button{background:none;border:0;padding:14px;font-weight:600;color:var(--accent-text)}
.ios-alert .acts button + button{border-left:1px solid var(--line);font-weight:800}

/* Sorting + editor */
.sort-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.infobtn{width:30px;height:30px;border-radius:50%;border:0;background:var(--accent);color:#FFFFFF;font-family:Georgia, serif;font-weight:700;font-style:italic;font-size:16px;display:grid;place-items:center;flex:none;position:relative}
.infobtn.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(107,88,211,.45)}50%{box-shadow:0 0 0 8px rgba(107,88,211,0)}}
.tip{position:absolute;z-index:25;width:250px;background:var(--accent);color:#FFFFFF;border-radius:18px;padding:14px 16px;box-shadow:0 14px 34px rgba(87,69,196,.35);font-size:14px;font-weight:600;animation:softIn .5s ease both}
.tip::before{content:"";position:absolute;top:-8px;width:16px;height:16px;background:var(--accent);transform:rotate(45deg);border-radius:3px;right:var(--arrow,20px)}
.tip b{display:block;font-family:var(--display);font-size:15px;margin-bottom:2px}
.tip .row{margin-top:10px;justify-content:flex-end}
.tip button{background:#FFFFFF;color:var(--accent-text);border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}
.progressbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.progressbar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.search{position:relative;margin-top:14px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 16px 12px 42px;outline:none}
.search input:focus{border-color:var(--accent)}
.search > svg{position:absolute;left:15px;top:23px;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);z-index:20;max-height:300px;overflow-y:auto}
.results button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-2)}
.rname{font-weight:700;display:block}
.rhint{font-size:12px;color:var(--muted);display:block}
.sortcard{margin-top:16px}
.who{display:flex;align-items:center;gap:14px}
.who h2{font-size:23px;word-break:break-word}
.q{margin-top:20px}
.qlabel{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
.qhelp{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .sug{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;opacity:.75}
.imp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.imp button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 0;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.imp button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.imp-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.mode{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent-text)}
.mode.sd .ic{color:var(--sky);background:var(--sky-soft)}
.mode b{font-size:14px;display:block}
.mode span.d{font-size:12px;color:var(--muted);line-height:1.35}
.mode .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.mode.sd[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.mode.sd[aria-pressed="true"] .ic{background:#FFFFFF}
.mode.sd[aria-pressed="true"] .tick{background:var(--sky);border-color:var(--sky)}
.both-tag{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:12px;font-weight:800;color:var(--accent-text)}
.both-tag::before,.both-tag::after{content:"";flex:1;height:1px;background:var(--line)}
.both-note{margin-top:10px;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;background:linear-gradient(90deg,var(--accent-soft),var(--sky-soft));color:var(--ink);animation:softIn .4s ease both}
.freq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:36px;height:36px;border:0;background:none;font-size:18px;font-weight:800;color:var(--accent-text)}
.stepper output{min-width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.freq select{border:1.5px solid var(--line);border-radius:999px;background:var(--surface);padding:7px 12px;font-weight:700}
.path{display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.path button{position:relative;border:0;background:none;padding:0 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.path button::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.path button:first-child::before{display:none}
.path button.reached::before{background:var(--accent)}
.path .node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center}
.path button.reached .node{border-color:var(--accent);background:var(--accent-soft)}
.path button[aria-pressed="true"] .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.path button[aria-pressed="true"]{color:var(--accent-text)}
.notefield{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2);outline:none}
.notefield:focus{border-color:var(--accent)}
.sort-actions{display:grid;gap:8px;margin-top:20px}
.start-banner{margin-top:14px;border-radius:20px;padding:14px 16px;background:var(--accent-soft);display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.start-banner p{font-size:14px;color:var(--accent-text);font-weight:700;flex:1;min-width:180px}
.info h3{font-size:16px;margin-top:18px}
.info p{font-size:14px;margin-top:4px}
.info .cats{display:grid;gap:6px;margin-top:8px}
.info .cats div{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:13px}

/* Home */
.hello{margin-top:18px}
.hello h1{font-size:29px;line-height:1.15}
.hello p{margin-top:8px}
.sec{margin-top:38px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:20px}
.sec-sub{font-size:13px;color:var(--muted);margin:6px 0 14px}
.timeleft{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 22px;margin:0 -22px;padding:4px 22px 16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pick{flex:none;width:82%;scroll-snap-align:start;display:flex;flex-direction:column}
.carousel.one .pick{width:100%}
.pick .top{display:flex;gap:12px;align-items:center}
.pick h3{font-size:18px;word-break:break-word}
.reason{margin-top:14px;font-size:14px;background:var(--surface-2);border-radius:16px;padding:11px 13px;flex:1}
.reason b{color:var(--accent-text);font-size:12px;display:block}
.pick .row{margin-top:14px}
.pick.done{opacity:.72}
.qtop .top{display:flex;gap:14px;align-items:flex-start}
.qtop h3{font-size:19px;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.lastnote{margin-top:14px;background:var(--surface-2);border-radius:16px;padding:11px 13px;font-size:14px}
.lastnote .lbl{font-size:12px;font-weight:800;color:var(--accent-text);display:block;margin-bottom:2px}
.qtop .row{margin-top:16px}
.qlist{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.qrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 16px;text-align:left}
.qrow:first-child{border-top:0}
.qrow .rank{font-family:var(--display);font-weight:700;color:var(--muted);width:22px;font-variant-numeric:tabular-nums;flex:none}
.qrow .txt{flex:1;min-width:0}
.qrow .nm{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .ht{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.helper{display:inline-flex;align-items:center;gap:6px;margin-top:12px}
.prog{display:grid;gap:10px}
.progcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.progcard .txt{min-width:0}
.progcard b{display:block}
.progcard .ht{font-size:13px;color:var(--muted)}
.progcard .row{grid-column:1 / -1;margin-top:2px}
.waiting{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sky)}
.waiting i{width:7px;height:7px;border-radius:50%;background:var(--sky);animation:pulse 1.8s ease-in-out infinite}

/* Contacts */
.titlerow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.plusbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--accent-text);font-size:22px;font-weight:700;display:grid;place-items:center}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 22px 4px;margin:0 -22px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none;padding:6px 12px;font-size:13px}

<script>

/* ---------- Constants ---------- */
const DAY = 86400000;

  work:  [[1,"year"],[6,"month"],[3,"month"],[2,"month"],[1,"month"]],
  school:[[1,"year"],[6,"month"],[4,"month"],[2,"month"],[1,"month"]],

};

  ["It's been a while", n=>`Hey ${n}! I know it's been a while. I've been trying to reconnect with people who matter to me, and you came to mind. How have you been?`],

  ["Thought of you", n=>`Hey ${n}, I saw something today that made me think of you. How are things going?`],
  ["Quick check-in", n=>`Hey ${n}, just checking in. How's everything going lately?`]

const STORE_KEY = "nets-app-v3";

function suggestCat(name, hint){
  const s = (name+" "+hint).toLowerCase();
  if (/'s mom|mom$/.test(s) && !/^mama/.test(s)) return "other";
  if (/^mama|tío|tio |cousin|tuesta|bravim/.test(s)) return "family";

  if (/leasing|maintenance|emergency|nutrition|petkey|beauty society|uber|fitness|bar$/.test(s)) return "other";

}

  if (cat==="friend" && imp>=5) return 3;
  if ((cat==="family" || cat==="friend") && imp>=4) return 2;

/* ---------- State ---------- */
function newContact(id, n, h, manual){

function wireHold(){

function parseVcf(text){
  const lines = String(text).replace(/\r\n?/g,"\n").replace(/\n[ \t]/g,"").split("\n");
  const un = v => v.replace(/\\n/gi," ").replace(/\\([,;\\])/g,"$1").replace(/\s+/g," ").trim();
  const out=[]; let cur=null;
  for (const raw of lines){
    const line=raw.trim(); if (!line) continue; const up=line.toUpperCase();
    if (up==="BEGIN:VCARD"){ cur={fn:"",n:"",org:"",note:"",tel:"",telRank:0}; continue; }
    if (up==="END:VCARD"){ if (cur){ const name=cur.fn||cur.n; if (name) out.push([name, cur.org || (cur.note.length<=40?cur.note:""), cur.tel]); } cur=null; continue; }
    if (!cur) continue;
    const k=line.indexOf(":"); if (k<0) continue;
    const key=line.slice(0,k).split(";")[0].split(".").pop().toUpperCase(), val=line.slice(k+1);
    if (key==="TEL"){ const params=line.slice(0,k).toUpperCase(); const rank=params.includes("PREF")?3:params.includes("CELL")?2:1; const num=val.replace(/[^\d+]/g,""); if (num.length>=7 && rank>cur.telRank){ cur.tel=num; cur.telRank=rank; } }
    else if (key==="FN") cur.fn=un(val);
    else if (key==="N" && !cur.n){ const p=val.split(";").map(un); cur.n=[p[1],p[0]].filter(Boolean).join(" "); }
    else if (key==="ORG") cur.org=un(val.split(";").filter(x=>x.trim()).join(", "));
    else if (key==="NOTE") cur.note=un(val);
  }
  return out;
}
function importContacts(list){
  const seen=new Set(S.contacts.map(c=>(c.n+"|"+c.h).toLowerCase())); let added=0;
  const byKey=new Map(S.contacts.map(c=>[(c.n+"|"+c.h).toLowerCase(), c]));
  list.forEach(([n,h,tel])=>{ const c=newContact("c"+uid(), n, h); const key=(c.n+"|"+c.h).toLowerCase(); if (!c.n) return;
    if (seen.has(key)){ const ex=byKey.get(key); if (ex && !ex.tel && tel) { ex.tel=tel; S.phonesAdded=(S.phonesAdded||0)+1; } return; }
    c.tel=tel||""; seen.add(key); byKey.set(key,c); S.contacts.push(c); added++; });
  return added;
}
function readContactsFile(file, done){
  const r=new FileReader();
  r.onload=()=>{ const list=parseVcf(r.result); done(list.length ? importContacts(list) : -1); };

  r.readAsText(file);
}

/* ---------- Person editor ---------- */
let draft = null;
function startDraft(c){
  const t = isTracked(c);
  draft = {id:c.id, cat: t ? c.cat : c.sug, imp:c.imp, sched: t ? c.sched : true, someday: t ? c.someday : false, fn:c.fn, fu:c.fu,
    goal: t ? c.goal : null, manualF: !!c.fn, manualG: t, note:""};
  applyDefaults();
}
function applyDefaults(){
  if (!draft.cat || !draft.imp) return;
  if (!draft.manualF){ const [n,u]=DEFAULTS[draft.cat][draft.imp-1]; draft.fn=n; draft.fu=u; }
  if (!draft.manualG) draft.goal = suggestGoal(draft.cat, draft.imp);
}
const draftOK = () => draft.cat && draft.imp && (draft.sched || draft.someday);

    <div class="imp-legend"><span>Nice to have</span><span style="color:var(--accent-text);font-weight:700">${d.imp?esc(IMP_LABEL[d.imp]):""}</span><span>Very important</span></div>
  </div>
  ${ready ? `
  <div class="q"><span class="qlabel" id="ql3">How do you want to keep in touch?</span>
    <div class="modes" role="group" aria-labelledby="ql3">

      <button type="button" class="mode sd" data-mode="someday" aria-pressed="${d.someday}"><span class="tick">${icons.check}</span><span class="ic">${icons.spark}</span><b>Someday</b><span class="d">Pops up in your picks</span></button>

      : `<p class="both-tag">${icons.spark.replace('width="20" height="20"','width="12" height="12"')} Pick both for a natural start</p>`}
    ${!d.sched && !d.someday ? `<p class="small" style="color:var(--warn);font-weight:700;margin-top:6px;text-align:center">Pick at least one</p>`:""}

function wireEditor(root, rerender){
  const keep = ()=>{ const n=root.querySelector("#snote"); if (n) draft.note=n.value; };
  const on = (sel, fn) => root.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ keep(); fn(b); rerender(); });
  on("[data-cat]", b=>{ draft.cat=b.dataset.cat; applyDefaults(); });
  on("[data-imp]", b=>{ draft.imp=+b.dataset.imp; applyDefaults(); });
  on("[data-mode]", b=>{ draft[b.dataset.mode] = !draft[b.dataset.mode]; });
  on("[data-goal]", b=>{ draft.goal=+b.dataset.goal; draft.manualG=true; });
  on("#fminus", ()=>{ draft.fn=Math.max(1,(draft.fn||1)-1); draft.manualF=true; });
  on("#fplus", ()=>{ draft.fn=Math.min(99,(draft.fn||1)+1); draft.manualF=true; });
  const u=root.querySelector("#fu"); if (u) u.onchange=()=>{ keep(); draft.fu=u.value; draft.manualF=true; rerender(); };
  const n=root.querySelector("#snote"); if (n) n.oninput=()=>{ draft.note=n.value; };
}
function addNbItem(c, secName, text){
  let sec = c.nb.find(s=>s.name.toLowerCase()===secName.toLowerCase());
  if (!sec){ sec={id:uid(), name:secName, items:[]}; c.nb.push(sec); }
  sec.items.push({id:uid(), text, t:now()});
}
function commitDraft(){
  const c = byId(draft.id); const was = isTracked(c);
  Object.assign(c, {cat:draft.cat, imp:draft.imp, sched:draft.sched, someday:draft.someday, fn:draft.fn||1, fu:draft.fu||"month", goal:draft.goal||1, later:false});
  if (!was) c.sortedAt = now();
  if (draft.note && draft.note.trim()) addNbItem(c, "Notes", draft.note.trim());
}

/* ---------- Sorting screen ---------- */
let sortSearch = "";
function nextUnsorted(){ return S.contacts.find(c=>!c.cat && !c.later) || S.contacts.find(c=>!c.cat) || null; }
function renderSort(){
  const fromSetup = S.stage==="sort";
  let cur = S.sortCurrent ? byId(S.sortCurrent) : nextUnsorted();
  if (!cur){ finishSetup(); return; }
  if (!draft || draft.id!==cur.id) startDraft(cur);
  const left = unsorted().length, done = S.contacts.length-left, laterN = S.contacts.filter(c=>!c.cat&&c.later).length;
  const tCount = tracked().length, revisiting = !cur.cat && cur.later;
  app.innerHTML = `<section class="screen">
    <div class="topbar"><span class="brand">Nets</span>${fromSetup?"":`<button class="back" id="sortclose" type="button" style="margin:0">${icons.back} Done</button>`}</div>

        <div style="display:flex;align-items:center;gap:10px"><span class="small muted" style="font-variant-numeric:tabular-nums;white-space:nowrap">${done} of ${S.contacts.length}${laterN?` · ${laterN} skipped`:""}</span>
        <span style="position:relative"><button class="infobtn ${S.tipSeen?"":"glow"}" id="info" type="button" aria-label="How sorting works">i</button>

      </div>

      <div class="search">${icons.search}<label class="sr" for="ssearch">Search a name</label>
        <input id="ssearch" type="search" autocomplete="off" placeholder="Someone in mind? Search their name" value="${esc(sortSearch)}">
        <div class="results" id="sresults" hidden></div></div>
      ${tCount>=10 && fromSetup ? `<div class="start-banner"><p>You've sorted ${tCount} people. Start using Nets now and finish the rest later.</p><button class="btn btn-primary btn-sm" id="startq" type="button">Start Nets</button></div>`
        : fromSetup ? `<div class="start-banner"><p>Sort ${10-tCount} more ${10-tCount===1?"person":"people"} you'd keep in touch with to unlock your home screen.</p></div>` : ""}
      ${revisiting ? `<p class="small" style="margin-top:12px;color:var(--accent-text);font-weight:700">You skipped this one earlier. Decide now, or skip again.</p>`:""}

          <button class="btn btn-soft" id="skip" type="button">Don't track</button>
          <button class="btn btn-soft" id="undo" type="button" ${S.history.length?"":"disabled"}>Back</button>
        </div>
        <p class="small muted" style="text-align:center">Skip for now brings them back at the end. Don't track hides them from Nets.</p>
      </div>
    </div></section>`;
  const ed = document.getElementById("editor"), sv = document.getElementById("savenext");
  const rer = ()=>{ ed.innerHTML = editorHTML(cur, true); wireEditor(ed, rer); sv.disabled = !draftOK(); };
  rer();
  const advance = ()=>{ S.history.push(cur.id); S.sortCurrent=null; draft=null; sortSearch=""; save(); renderSort(); const sc=document.getElementById("sortscroll"); if (sc) sc.scrollTop=0; };
  sv.onclick=()=>{ const n=ed.querySelector("#snote"); if (n) draft.note=n.value; commitDraft(); advance(); };
  document.getElementById("later").onclick=()=>{ if(!cur.cat) cur.later=true; advance(); };
  document.getElementById("skip").onclick=()=>{ cur.cat="skip"; cur.later=false; advance(); };
  document.getElementById("undo").onclick=()=>{ const id=S.history.pop(); if(!id) return; S.sortCurrent=id; draft=null; save(); renderSort(); };
  document.getElementById("info").onclick=()=>{ S.tipSeen=true; save(); const t=document.getElementById("tip"); if (t) t.remove(); document.getElementById("info").classList.remove("glow"); openSortInfo(); };
  const tok=document.getElementById("tipok"); if (tok) tok.onclick=()=>{ S.tipSeen=true; save(); document.getElementById("tip").remove(); };
  const sq=document.getElementById("startq"); if (sq) sq.onclick=finishSetup;
  const sc=document.getElementById("sortclose"); if (sc) sc.onclick=()=>{ S.stage="app"; S.sortCurrent=null; draft=null; save(); render(); };
  const inp=document.getElementById("ssearch"), res=document.getElementById("sresults");
  const show=()=>{
    sortSearch=inp.value; const q=inp.value.trim().toLowerCase();
    if (!q){ res.hidden=true; return; }

    res.innerHTML = hits.map(c=>`<button type="button" data-id="${c.id}"><span style="min-width:0"><span class="rname">${esc(c.n)}</span>${c.h?`<span class="rhint">${esc(c.h)}</span>`:""}</span>${c.cat?`<span class="pill ${c.cat==="skip"?"plain":""}">${c.cat==="skip"?"Not tracked":CAT_LABEL[c.cat]}</span>`:`<span class="pill plain">${c.later?"Skipped":"Unsorted"}</span>`}</button>`).join("")
      + `<button type="button" id="addnew"><span><span class="rname" style="color:var(--accent-text)">+ Add "${esc(inp.value.trim())}" as a new person</span><span class="rhint">For someone who isn't in your phone</span></span></button>`;
    res.hidden=false;
    res.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{ S.sortCurrent=b.dataset.id; draft=null; sortSearch=""; save(); renderSort(); });

  };

function daysLeftText(){
  const d = Math.ceil((weekEnd()-now())/DAY);
  return d<=1 ? "Last day this week" : d+" days left this week";
}
function reasonFor(c){
  const nb = c.nb.find(s=>s.items.length); const item = nb && nb.items[nb.items.length-1];
  const lastLog = lastLogOf(c);
  const head = somedayMode(c) ? "From your Someday list" : "Not due yet, but a good time";
  let body;
  if (lastLog) body = `Last time (${ago(lastLog.t)}): ${esc(lastLog.type.toLowerCase())}${lastLog.note?". "+esc(lastLog.note):""}`;
  else if (item) body = `${esc(nb.name)}: ${esc(item.text)}`;
  else body = c.h ? `You know ${esc(first(c.n))} from ${esc(c.h)}. A quick "hey, how have you been?" is enough.` : `A quick "hey, how have you been?" is enough.`;
  return `<b>${head}</b>${body}`;
}
function statusPill(c){
  if (c.prog) return `<span class="pill sky">In progress</span>`;
  if (somedayMode(c)) return `<span class="pill sky">Someday</span>`;
  if ((c.snoozeUntil||0) > now()) return `<span class="pill plain">Snoozed until ${fmtDate(c.snoozeUntil)}</span>`;
  if (isDue(c)) return `<span class="pill warn">Due this week</span>`;
  const d = Math.round((dueAt(c)-now())/DAY);
  return `<span class="pill ok">Due ${d<14?"in "+span(Math.max(1,d)):fmtDate(dueAt(c))}</span>`;
}

        <div class="reason">${reasonFor(c)}</div>
        ${isDone ? `<p class="small" style="margin-top:14px;color:var(--ok);font-weight:800">${icons.check} Reached out this week</p>` :
        `${quickBtns(c)}<div class="row"><button class="btn btn-primary btn-sm" data-reach="${id}" type="button">I reached out</button><button class="btn btn-soft btn-sm" data-swap="${id}" type="button">Swap</button></div>
         <button class="link helper" data-draft="${id}" type="button">${icons.pen} Help me start the message</button>`}
      </article>`; };
  const carousel = ids => `<div class="carousel ${ids.length===1?"one":""}">${ids.map(pickCard).join("")}</div>`;

    if (extra.length) h += `<p class="sec-sub" style="margin-top:18px">Feeling good? These are still here as a bonus.</p>${carousel(extra)}`;
  } else {

      prog.map(c=>`<article class="progcard">${av(c," sm")}<div class="txt"><b><button class="namebtn" data-open="${c.id}" type="button">${esc(c.n)}</button></b>
        <span class="ht">${esc(c.prog.via)} ${ago(c.prog.since)}</span><br><span class="waiting"><i></i> Waiting on a ${GOALS[c.goal].toLowerCase()}</span></div>
        <div style="grid-column:1 / -1">${quickBtns(c)}</div>

  }
  // Up next
  h += `<section class="sec"><div class="sec-head"><h2>Up next</h2>${due.length+later.length?`<button class="link" id="seeall" type="button">See all (${due.length+later.length})</button>`:""}</div>
    <p class="sec-sub">${due.length ? `${due.length} ${due.length===1?"person is":"people are"} due this week. Start at the top whenever you're ready.` : "No one is due this week."}</p>`;
  if (due.length){
    const c = due[0]; const lastLog = lastLogOf(c);
    h += `<article class="card qtop${pendingFor(c.id)?" pending nudge-target":""}"><div class="top">${av(c,"")}<div style="min-width:0;flex:1">
        <h3><button class="namebtn" data-open="${c.id}" type="button">${esc(c.n)}</button></h3>
        <div class="meta"><span class="pill">${CAT_LABEL[c.cat]}</span>${dots(c.imp)}${statusPill(c)}</div></div></div>
      <div class="meta" style="margin-top:10px"><span class="pill plain">${goalIcon(c.goal)} Goal: ${GOALS[c.goal]}</span>${c.snoozeCount?`<span class="pill gold">Snoozed ${c.snoozeCount===1?"once":c.snoozeCount+" times"} before</span>`:""}</div>
      ${lastLog ? `<div class="lastnote"><span class="lbl">Last time · ${logDate(lastLog)} · ${esc(lastLog.type)}</span>${lastLog.note?esc(lastLog.note):'<span class="muted">No note added.</span>'}</div>`
        : `<div class="lastnote"><span class="lbl">First check-in</span><span class="muted">${c.h?`You know ${esc(first(c.n))} from ${esc(c.h)}. `:""}Nothing logged yet.</span></div>`}
      ${quickBtns(c)}<div class="row"><button class="btn btn-primary" data-reach="${c.id}" type="button">I reached out</button><button class="btn btn-soft" data-snooze="${c.id}" type="button">Snooze</button></div>
      <button class="link helper" data-draft="${c.id}" type="button">${icons.pen} Help me start the message</button>
    </article>`;
    const rest = due.slice(1,4).concat(due.length<4 ? later.slice(0, 4-due.length) : []);

  } else if (later.length){

  }
  return h + `</section>`;
}

function allLogs(){ const out=[]; tracked().concat(S.contacts.filter(c=>!isTracked(c))).forEach(c=>c.log.forEach(l=>out.push({c,l}))); return out; }
function calendarHTML(){
  const base = new Date(now()); base.setDate(1); base.setMonth(base.getMonth()+S.calMonth);
  const y=base.getFullYear(), m=base.getMonth();
  const mStart=new Date(y,m,1).getTime(), mEnd=new Date(y,m+1,1).getTime();
  const logs = allLogs();
  const inMonthAll = logs.filter(x=>x.l.t>=mStart && x.l.t<mEnd);
  const inMonth = inMonthAll.filter(x=>!x.l.noDate);
  const undated = logs.filter(x=>x.l.noDate).sort((a,b)=>b.l.t-a.l.t);
  const people = new Set(inMonthAll.map(x=>x.c.id)).size;
  const meaningful = inMonthAll.filter(x=>x.l.level>=x.l.goal).length;
  // weekly streak: consecutive completed weeks (ending last week, plus this week if already met) where unique people reached >= goal
  let streakW=0; { let ws=weekStart(now()); const cnt=w=>new Set(logs.filter(x=>x.l.t>=w&&x.l.t<w+7*DAY).map(x=>x.c.id)).size;
    if (cnt(ws)>=S.perWeek) streakW++; ws-=7*DAY; while (cnt(ws)>=S.perWeek){ streakW++; ws-=7*DAY; } }
  const byDay = {}; inMonth.forEach(x=>{ const k=dayStr(x.l.t); (byDay[k]=byDay[k]||[]).push(x); });
  const lead = (new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), todayK=dayStr(now());
  let cells = ""; for (let i=0;i<lead;i++) cells+=`<span class="day out" aria-hidden="true"></span>`;
  for (let d=1; d<=days; d++){
    const k=dayStr(new Date(y,m,d,12).getTime()), items=byDay[k]||[];
    const dd = items.slice(0,4).map(x=>`<i class="${x.l.level>=x.l.goal?"":"l"}"></i>`).join("") + (items.length>4?`<i></i>`:"");
    cells += `<button type="button" class="day ${items.length?"has":""} ${k===todayK?"today":""}" data-day="${k}" aria-pressed="${S.calDay===k}" ${k>todayK?"disabled":""} aria-label="${d}${items.length?`, ${items.length} interaction${items.length>1?"s":""}`:""}">${d}<span class="ddots">${dd}</span></button>`;
  }
  const sel = S.calDay && byDay[S.calDay];
  return `<h1 style="font-size:25px;margin-top:16px">Your journey</h1>
    <p class="muted small" style="margin-top:6px">Every dot is a time you reached out. Look how far you've come.</p>
    <div class="calstats">
      <div class="stat"><div class="num">${people}</div><div class="k">People this month</div></div>
      <div class="stat"><div class="num">${meaningful}</div><div class="k">Real time</div></div>
      <div class="stat"><div class="num">${streakW}</div><div class="k">Week streak</div></div>
    </div>
    <div class="calhead"><h2>${base.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</h2>
      <div class="calnav"><button type="button" id="calprev" aria-label="Previous month">${icons.back}</button><button type="button" id="calnext" aria-label="Next month">${icons.fwd}</button></div></div>
    <div class="cal"><div class="dow">${["M","T","W","T","F","S","S"].map(x=>`<span>${x}</span>`).join("")}</div><div class="grid">${cells}</div>
      <div class="legend"><span><i></i> Real time</span><span><i class="l"></i> Lighter check-in</span></div></div>
    ${S.calDay ? `<p class="eyebrow" style="margin-top:22px">${new Date(parseDay(S.calDay)).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</p>
      ${sel && sel.length ? `<div class="daylist">${sel.map(x=>`<button type="button" class="dayitem" data-open="${x.c.id}">${av(x.c," sm")}<div class="txt"><b>${esc(x.c.n)}</b> <span class="pill ${x.l.level>=x.l.goal?"":"plain"}" style="margin-left:4px">${esc(x.l.type)}</span>${x.l.note?`<div class="note">${esc(x.l.note)}</div>`:""}</div></button>`).join("")}</div>` : `<p class="small muted" style="margin-top:8px">Nothing logged this day yet.</p>`}
      <button class="btn btn-primary btn-block" id="callog" type="button" style="margin-top:12px">+ Log an interaction on ${new Date(parseDay(S.calDay)).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</button>`
      : `<p class="small muted" style="margin-top:16px;text-align:center">Tap any day to see who you reached or to log an interaction.</p>`}
    ${undated.length ? `<div class="card" style="margin-top:22px"><span class="qlabel">Missing a date</span><p class="small muted">${undated.length} interaction${undated.length===1?"":"s"} logged without a date. Add one so ${undated.length===1?"it shows":"they show"} up on your calendar.</p>
      <div class="daylist">${undated.map(x=>`<button type="button" class="dayitem" data-editlog="${x.c.id}|${x.l.id}">${av(x.c," sm")}<div class="txt"><b>${esc(x.c.n)}</b> <span class="pill plain" style="margin-left:4px">${esc(x.l.type)}</span><div class="note">Logged ${fmtDate(x.l.t)}. Tap to add the date.</div></div></button>`).join("")}</div></div>` : ""}`;
}

function b64uToU8(s){ const p="=".repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b, ch=>ch.charCodeAt(0)); }
async function turnOnPush(){
  const perm = await Notification.requestPermission();
  if (perm!=="granted"){ renderApp(); return toast("Notifications weren't allowed"); }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uToU8(VAPID_PUBLIC)});
  S.pushSub = JSON.stringify(sub); S.pushLinked=false; save(); writeReminder(); renderApp(); toast("Notifications allowed");
}
function reminderData(){
  const {due} = queueOrder(); const p=S.pool||{ids:[]};
  const picksLeft = p.ids.map(byId).filter(c=>c && !loggedThisWeek(c)).map(c=>first(c.n));
  return {v:1, updated:Date.now(), perWeek:S.perWeek, reached:reachedThisWeek().length, weekEnd:weekEnd(),
    due: due.slice(0,6).map(c=>({n:first(c.n), goal:GOALS[c.goal].toLowerCase()})),
    later: queueOrder().later.slice(0,10).map(c=>({n:first(c.n), at:dueAt(c), goal:GOALS[c.goal].toLowerCase()})),
    picks: picksLeft};
}
let remT=0;
function writeReminder(){
  clearTimeout(remT);
  remT=setTimeout(()=>{ try{
    if (S.stage!=="app") return;
    const data=reminderData();
    if (window.caches) caches.open("nets-data").then(c=>c.put("reminder", new Response(JSON.stringify(data),{headers:{"Content-Type":"application/json"}}))).catch(()=>{});
    if (navigator.setAppBadge) { const n=data.due.length; (n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(()=>{}); }
  }catch(e){} }, 400);
}

/* ---------- Sheets ---------- */
function sheet(inner, onMount){
  const scrim=document.createElement("div"); scrim.className="scrim";
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;
  scrim.addEventListener("click", e=>{ if (e.target===scrim){ scrim.remove(); } });
  app.appendChild(scrim); onMount && onMount(scrim); return scrim;
}
function dateUI(mode, day){
  const chips=[["today","Today"],["yesterday","Yesterday"],["pick","Pick a date"],["none","Add later"]];
  return `<div class="chips" role="group" aria-label="When">${chips.map(([k,l])=>`<button type="button" class="chip" data-dmode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>
    ${mode==="pick"?`<span class="datewrap"><label class="sr" for="ldate">Date</label><input type="date" class="datefield" id="ldate" value="${day||""}" max="${dayStr(now())}">${icons.calsm}</span>`:""}
    ${mode==="none"?`<p class="small muted" style="margin-top:8px">No problem. It still counts, and you can add the date later from their log or the calendar.</p>`:""}`;
}
function resolveDate(mode, day){
  if (mode==="none" || (mode==="pick" && !day)) return {t:now(), noDate:true};
  if (mode==="yesterday") return {t:now()-DAY, noDate:false};
  if (mode==="pick"){ const t=parseDay(day); return {t: dayStr(t)===dayStr(now()) ? now() : t, noDate:false}; }
  return {t:now(), noDate:false};
}
function wireDate(sc, get, set, paint){
  sc.querySelectorAll("[data-dmode]").forEach(b=>b.onclick=()=>{ get(); const m=b.dataset.dmode; set(m); paint(); });
  const di=sc.querySelector("#ldate"); if (di) di.addEventListener("click",()=>{ try{ di.showPicker(); }catch(_){} });
}
function openLog(id, presetType, presetDay){
  const c=byId(id); let type=presetType||null, note="", markProg=true;

    note=q("#lnote").value; const di=q("#ldate"); if (di) day=di.value;

    learns.forEach((L,i)=>{ L.sec=q(`[data-lsec="${i}"]`).value; L.text=q(`[data-ltext="${i}"]`).value; const nn=q(`[data-lnew="${i}"]`); if (nn) L.newSec=nn.value; }); };

    const lvl = type ? HOW_LEVEL[type] : 0, below = type && lvl < c.goal;
    sc.querySelector(".sheet").innerHTML = `<div class="grab"></div>
      <h2>You reached out to ${esc(first(c.n))}</h2>

      <div class="q"><span class="qlabel">How did you reach out?</span><div class="chips">${HOW.map(([t])=>`<button type="button" class="chip" data-how="${t}" aria-pressed="${type===t}">${t}</button>`).join("")}</div>
      ${type ? (!below ? `<div class="verdict ok">This counts as real time together. ${esc(first(c.n))}'s timer resets.</div>`
        : `<div class="verdict sky">Nice start. ${esc(first(c.n))}'s goal is ${c.goal===3?"meeting up":"a call"}, so this alone won't reset their timer.</div>
           <label class="toggle"><input type="checkbox" id="lprog" ${markProg?"checked":""}> I asked to set up a ${GOALS[c.goal].toLowerCase()}. Move ${esc(first(c.n))} to In progress.</label>`) : ""}</div>
      <div class="q"><span class="qlabel">When? <span class="muted" style="font-weight:600">(optional)</span></span>${dateUI(dmode, day)}</div>
      <div class="q"><label class="qlabel" for="lnote">How did it go? <span class="muted" style="font-weight:600">(optional)</span></label>
        <textarea id="lnote" placeholder="e.g. Texted to ask how she's doing. She graduated in May and just started a job in Chicago.">${esc(note)}</textarea></div>
      <div class="q"><span class="qlabel">Learn something new? <span class="muted" style="font-weight:600">(optional)</span></span>
        <div class="learn-rows">${learns.map((L,i)=>`<div class="learn-row"><div class="addrow">
          <select data-lsec="${i}" aria-label="Section">${secNames.map(n=>`<option ${n===L.sec?"selected":""}>${esc(n)}</option>`).join("")}<option value="__new" ${L.sec==="__new"?"selected":""}>+ New section</option></select>
          <input data-ltext="${i}" aria-label="What you learned" placeholder="${i===0?"e.g. Birthday is March 14":"Something else you learned"}" value="${esc(L.text)}" autocomplete="off">
          ${learns.length>1?`<button class="x" data-lrm="${i}" type="button" aria-label="Remove this one">×</button>`:""}</div>
          ${L.sec==="__new"?`<input class="notefield" data-lnew="${i}" placeholder="Name the new section" value="${esc(L.newSec)}">`:""}</div>`).join("")}</div>
        <button class="link" id="laddrow" type="button" style="margin-top:8px">+ Add another</button>
        <p class="small muted" style="margin-top:2px">Saved to About ${esc(first(c.n))}.</p></div>
      <div class="rule">${icons.check}<span>Only log it if you started the conversation. Them reaching out first doesn't count here.</span></div>
      <div class="row" style="margin-top:16px"><button class="btn btn-soft" id="lcancel" type="button">Cancel</button><button class="btn btn-primary" id="lsave" type="button" ${type?"":"disabled"}>Save to log</button></div>`;
    sc.querySelectorAll("[data-how]").forEach(b=>b.onclick=()=>{ keep(); type=b.dataset.how; paint(); });
    wireDate(sc, keep, m=>{ dmode=m; if (m==="pick" && !day) day=dayStr(now()); }, paint);
    sc.querySelectorAll("[data-lsec]").forEach(x=>x.onchange=()=>{ keep(); paint(); });
    sc.querySelectorAll("[data-lrm]").forEach(b=>b.onclick=()=>{ keep(); learns.splice(+b.dataset.lrm,1); paint(); });
    sc.querySelector("#laddrow").onclick=()=>{ keep(); const last=learns[learns.length-1]; learns.push({sec:last?last.sec:secNames[0], text:"", newSec:""}); paint(); const ni=sc.querySelector(`[data-ltext="${learns.length-1}"]`); ni && ni.focus(); };
    sc.querySelector("#lcancel").onclick=()=>sc.remove();
    sc.querySelector("#lsave").onclick=()=>{
      keep(); const level=HOW_LEVEL[type]; const {t, noDate}=resolveDate(dmode, day); const prevM=c.lastM||0;
      c.log.push({id:uid(), t, noDate, type, note:note.trim(), level, goal:c.goal}); recompute(c); if (S.pending && S.pending.id===c.id) S.pending=null;
      let msg;
      if (level>=c.goal){ if (t>=prevM){ c.snoozeCount=0; c.snoozeUntil=0; c.prog=null; } msg="Logged. Nice work."; }
      else if (markProg){ c.prog={since:t, via:type}; msg=first(c.n)+" moved to In progress"; }

      let added=0; learns.forEach(L=>{ if (L.text.trim()){ addNbItem(c, L.sec==="__new" ? (L.newSec.trim()||"Notes") : L.sec, L.text.trim()); added++; } });
      save(); sc.remove(); renderApp(); toast(msg);
    };
  };
  paint();
}
function openLogEdit(cid, lid){
  const c=byId(cid), l=c && c.log.find(x=>x.id===lid); if (!l) return;
  let type=l.type, note=l.note||"", dmode=l.noDate?"none":"pick", day=l.noDate?"":dayStr(l.t), armed=false;
  const sc=sheet("");
  const keep=()=>{ note=sc.querySelector("#lnote").value; const di=sc.querySelector("#ldate"); if (di) day=di.value; };
  const paint=()=>{
    sc.querySelector(".sheet").innerHTML=`<div class="grab"></div><h2>Edit interaction</h2><p class="small muted" style="margin-top:4px">With ${esc(c.n)}</p>
      <div class="q"><span class="qlabel">How did you reach out?</span><div class="chips">${HOW.map(([t])=>`<button type="button" class="chip" data-how="${t}" aria-pressed="${type===t}">${t}</button>`).join("")}</div></div>
      <div class="q"><span class="qlabel">When? <span class="muted" style="font-weight:600">(optional)</span></span>${dateUI(dmode, day)}</div>
      <div class="q"><label class="qlabel" for="lnote">Note</label><textarea id="lnote" placeholder="How did it go?">${esc(note)}</textarea></div>
      <div class="row" style="margin-top:16px"><button class="btn btn-soft" id="lcancel" type="button">Cancel</button><button class="btn btn-primary" id="lsave" type="button">Save</button></div>
      <button class="btn btn-ghost btn-block" id="ldel" type="button" style="margin-top:6px;color:var(--warn)">${armed?"Tap again to delete":"Delete this interaction"}</button>`;
    sc.querySelectorAll("[data-how]").forEach(b=>b.onclick=()=>{ keep(); type=b.dataset.how; paint(); });
    wireDate(sc, keep, m=>{ dmode=m; if (m==="pick" && !day) day=dayStr(now()); }, paint);
    sc.querySelector("#lcancel").onclick=()=>sc.remove();
    sc.querySelector("#lsave").onclick=()=>{ keep();
      if (dmode==="none" || (dmode==="pick" && !day)) l.noDate=true; else { const r=resolveDate(dmode, day); l.t=r.t; l.noDate=false; }
      l.type=type; l.level=HOW_LEVEL[type]; l.note=note.trim(); recompute(c); save(); sc.remove(); const ms=document.getElementById("mainscroll"), top=ms?ms.scrollTop:0; renderApp(); const m2=document.getElementById("mainscroll"); if (m2) m2.scrollTop=top; toast("Saved"); };
    sc.querySelector("#ldel").onclick=()=>{ if (!armed){ keep(); armed=true; paint(); return; }
      c.log=c.log.filter(x=>x!==l); recompute(c); save(); sc.remove(); renderApp(); toast("Interaction deleted"); };
  };
  paint();
}

/* ---------- Wiring ---------- */
function wireApp(){
  const $=id=>document.getElementById(id);
  const keepScroll = fn => { const top=$("mainscroll").scrollTop; fn(); $("mainscroll").scrollTop=top; };
  app.querySelectorAll("[data-reach]").forEach(b=>b.onclick=()=>openLog(b.dataset.reach));
  app.querySelectorAll("[data-happened]").forEach(b=>b.onclick=()=>{ const c=byId(b.dataset.happened); openLog(c.id, GOAL_HOW[c.goal]); });
  app.querySelectorAll("[data-unprog]").forEach(b=>b.onclick=()=>{ const c=byId(b.dataset.unprog); c.prog=null; save(); renderApp(); toast(first(c.n)+" is back in your queue"); });
  app.querySelectorAll("[data-snooze]").forEach(b=>b.onclick=()=>openSnooze(b.dataset.snooze));
  app.querySelectorAll("[data-draft]").forEach(b=>b.onclick=()=>openDraft(b.dataset.draft));
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>goDetail(b.dataset.open));
  app.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.swap, p=S.pool; p.swapped.push(id);
    const nx=drawPicks(1, new Set([...p.ids,...p.swapped]), Date.now())[0];
    p.ids = p.ids.map(x=>x===id?nx:x).filter(Boolean); save(); renderApp();
    toast(nx ? "Swapped in "+first(byId(nx).n) : "No one else to swap in this week");
  });
  if ($("seeall")) $("seeall").onclick=()=>{ S.view="queue"; save(); renderApp(); $("mainscroll").scrollTop=0; };
  if ($("qback")) $("qback").onclick=()=>{ S.view=null; save(); renderApp(); };
  if ($("dback")) $("dback").onclick=()=>{ S.detail=null; if (S.detailFrom==="queue") S.view="queue"; else if (S.detailFrom) S.tab=S.detailFrom; save(); renderApp(); };
  if ($("dedit")) $("dedit").onclick=()=>{ const c=byId(S.detail); if (isTracked(c)) openEdit(S.detail); else { S.stage="sortmore"; S.sortCurrent=S.detail; S.detail=null; draft=null; save(); render(); } };
  app.querySelectorAll("[data-setgoal]").forEach(b=>b.onclick=()=>{ const c=byId(S.detail); c.goal=+b.dataset.setgoal; c.promoSeen=c.log.length; save(); keepScroll(renderApp); toast("Goal set to "+GOALS[c.goal].toLowerCase()); });
  if ($("promote")) $("promote").onclick=()=>{ const c=byId(S.detail); c.goal++; c.promoSeen=c.log.length; save(); keepScroll(renderApp); toast(first(c.n)+" promoted to "+GOALS[c.goal].toLowerCase()); };
  if ($("notyet")) $("notyet").onclick=()=>{ const c=byId(S.detail); c.promoSeen=c.log.length; save(); keepScroll(renderApp); };
  app.querySelectorAll("[data-addsec]").forEach(b=>b.onclick=()=>{ const c=byId(S.detail); c.nb.push({id:uid(), name:b.dataset.addsec, items:[]}); save(); keepScroll(renderApp); });
  if ($("customsec")) $("customsec").onsubmit=e=>{ e.preventDefault(); const v=$("csec").value.trim(); if(!v) return; const c=byId(S.detail); c.nb.push({id:uid(), name:v, items:[]}); save(); keepScroll(renderApp); };
  app.querySelectorAll("[data-additem]").forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const v=f.querySelector("input").value.trim(); if(!v) return; const c=byId(S.detail); const s=c.nb.find(x=>x.id===f.dataset.additem); s.items.push({id:uid(), text:v, t:now()}); save(); keepScroll(renderApp); const ni=$("ai-"+s.id); ni && ni.focus(); });
  app.querySelectorAll("[data-delitem]").forEach(b=>b.onclick=()=>{ const [sid,iid]=b.dataset.delitem.split("|"); const c=byId(S.detail); const s=c.nb.find(x=>x.id===sid); s.items=s.items.filter(x=>x.id!==iid); save(); keepScroll(renderApp); });
  app.querySelectorAll("[data-delsec]").forEach(b=>b.onclick=()=>{ const c=byId(S.detail); const s=c.nb.find(x=>x.id===b.dataset.delsec); if (s.items.length && !b.dataset.armed){ b.dataset.armed="1"; b.textContent="Delete?"; b.style.fontSize="12px"; b.style.fontWeight="800"; b.style.color="var(--warn)"; return; } c.nb=c.nb.filter(x=>x!==s); save(); keepScroll(renderApp); });
  if ($("csearch")) $("csearch").oninput=()=>{ const cs=$("csearch"); S.csearch=cs.value; save(); const pos=cs.selectionStart; renderApp(); const n=$("csearch"); n.focus(); n.setSelectionRange(pos,pos); };
  app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ S.filter=b.dataset.filter; save(); renderApp(); });
  if ($("addperson")) $("addperson").onclick=()=>openAddPerson("");
  app.querySelectorAll("[data-pace]").forEach(b=>b.onclick=()=>{ S.perWeek=+b.dataset.pace; const p=S.pool; while (p.ids.length>S.perWeek) p.ids.pop(); topUpPool(); save(); renderApp(); });
  if ($("gosort")) $("gosort").onclick=()=>{ S.stage="sortmore"; S.sortCurrent=null; S.encShown=false; draft=null; save(); render(); };
  if ($("callog")) $("callog").onclick=()=>openPersonPicker(S.calDay);
  app.querySelectorAll("[data-editlog]").forEach(b=>b.onclick=()=>{ const [cid,lid]=b.dataset.editlog.split("|"); openLogEdit(cid,lid); });
  if ($("photoin")) $("photoin").onchange=e=>{
    const f=e.target.files && e.target.files[0]; if (!f) return; const c=byId(S.detail);
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const side=Math.min(img.width,img.height), cv=document.createElement("canvas"); cv.width=cv.height=200;
        cv.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,200,200);
        const had=!!c.photo; c.photo=cv.toDataURL("image/jpeg",0.82); save(); keepScroll(renderApp); toast(had?"Photo updated":"Photo added"); };
      img.onerror=()=>toast("Nets can't read that file. Try a JPG or PNG.");
      img.src=r.result; };
    r.readAsDataURL(f);
  };
  if ($("rmphoto")) $("rmphoto").onclick=()=>{ const c=byId(S.detail); c.photo=null; save(); keepScroll(renderApp); toast("Photo removed"); };
  if ($("calprev")) $("calprev").onclick=()=>{ S.calMonth--; S.calDay=null; save(); renderApp(); };
  if ($("calnext")) $("calnext").onclick=()=>{ S.calMonth++; S.calDay=null; save(); renderApp(); };
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ S.calDay = S.calDay===b.dataset.day ? null : b.dataset.day; save(); keepScroll(renderApp); });
  app.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",()=>{ const [id,kind]=a.dataset.go.split("|"); S.pending={id, kind, at:Date.now()}; save(); }));
  if ($("plog")) $("plog").onclick=()=>openLog(S.pending.id, S.pending.kind);
  if ($("pclear")) $("pclear").onclick=()=>{ S.pending=null; save(); renderApp(); };
  if ($("teledit")) $("teledit").onclick=()=>{ S.editTel=true; keepScroll(renderApp); const i=$("telin"); i && i.focus(); };
  if ($("telform")) $("telform").onsubmit=e=>{ e.preventDefault(); const i=$("telin"); if (!i) return; const c=byId(S.detail); c.tel=i.value.replace(/[^\d+]/g,""); S.editTel=false; save(); keepScroll(renderApp); toast(c.tel?"Number saved":"Number removed"); };
  app.querySelectorAll("[data-textapp]").forEach(b=>b.onclick=()=>{ S.textApp=b.dataset.textapp; save(); keepScroll(renderApp); });
  if ($("pushon")) $("pushon").onclick=()=>{ turnOnPush().catch(err=>{ toast("Couldn't turn on reminders"); console.error(err); }); };
  if ($("copysub")) $("copysub").onclick=()=>{ const ta=$("subcode"); try { navigator.clipboard.writeText(S.pushSub).then(()=>toast("Copied"), ()=>{ ta.select(); toast("Select all and copy"); }); } catch(_){ ta.select(); } };
  if ($("pushdone")) $("pushdone").onclick=()=>{ S.pushLinked=true; save(); keepScroll(renderApp); toast("Daily reminder set"); };
  if ($("pushunlink")) $("pushunlink").onclick=()=>{ S.pushLinked=false; save(); keepScroll(renderApp); };
  if ($("pushtest")) $("pushtest").onclick=async()=>{ try { const reg=await navigator.serviceWorker.ready; const d=reminderData(); await reg.showNotification(d.due.length?`Time to reach out to ${d.due[0].n}`:"Nets", {body: d.due.length?`${d.due[0].n} is due this week. A quick message is a great start.`:"This is what your daily reminder will look like.", icon:"icon-192.png", tag:"nets-test"}); toast("Test sent"); } catch(_){ toast("Couldn't show a notification"); } };
  if ($("backtoday")) $("backtoday").onclick=()=>{ S.offset=0; S.pool=null; save(); renderApp(); toast("Back to today"); };
  if ($("vcfmore")) $("vcfmore").onchange=e=>{ const f=e.target.files && e.target.files[0]; if (!f) return; readContactsFile(f, n=>{ if (n<0) return toast("That isn't a contacts file"); save(); renderApp(); toast(n ? "Added "+n+" new contacts" : "No new contacts found"); }); };
  if ($("backup")) $("backup").onclick=()=>{
    const name="nets-backup-"+dayStr(Date.now())+".json", data=JSON.stringify(S);
    let file=null; try { file=new File([data], name, {type:"application/json"}); } catch(_){}
    if (file && navigator.canShare && navigator.canShare({files:[file]})) { navigator.share({files:[file], title:"Nets backup"}).catch(()=>{}); return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };
  if ($("restorein")) $("restorein").onchange=e=>{ const f=e.target.files && e.target.files[0]; if (!f) return; const r=new FileReader();
    r.onload=()=>{ try { const o=JSON.parse(r.result); if (o.v!==3 || !Array.isArray(o.contacts)) throw 0; S=o; save(); render(); toast("Backup restored"); } catch(_){ toast("That isn't a Nets backup file"); } };
    r.readAsText(f); };
  if ($("skipweek")) $("skipweek").onclick=()=>{ S.offset+=7; save(); renderApp(); toast("Jumped ahead 1 week"); };
  if ($("skipmonth")) $("skipmonth").onclick=()=>{ S.offset+=30; save(); renderApp(); toast("Jumped ahead 1 month"); };
  if ($("reset")) $("reset").onclick=()=>{
    $("resetwrap").innerHTML=`<p class="small" style="margin-bottom:8px;color:var(--warn);font-weight:800">This erases all your sorting, notes, and logs on this phone.</p><div class="row"><button class="btn btn-soft btn-sm" id="rsno" type="button">Keep everything</button><button class="btn btn-primary btn-sm" id="rsyes" type="button" style="background:var(--warn)">Erase and restart</button></div>`;
    $("rsno").onclick=()=>renderApp(); $("rsyes").onclick=()=>{ S=freshState(); draft=null; save(); render(); };
  };
}

S.contacts.forEach(c=>c.log.forEach(l=>{ if (!l.id) l.id=uid(); })); save();
function nudge(){ setTimeout(()=>{ document.querySelectorAll(".nudge-target").forEach(el=>{ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }); try{ navigator.vibrate && navigator.vibrate([30,60,30]); }catch(_){} }, 350); }
function checkPending(){ if (S.stage==="app" && S.pending && Date.now()-S.pending.at < 86400000 && byId(S.pending.id)){ S.tab="home"; S.detail=null; S.view=null; renderApp(); const m=document.getElementById("mainscroll"); if (m) m.scrollTop=0; nudge(); } }
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible"){ checkPending(); writeReminder(); } });
setTimeout(checkPending, 50);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
if ("serviceWorker" in navigator) addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>

</body>
</html>
